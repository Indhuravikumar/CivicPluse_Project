version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: civicpulse_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: civicpulse123
      MONGO_INITDB_DATABASE: civicpulse
    volumes:
      - mongo_data:/data/db
    networks:
      - civicpulse_net

  ai-service:
    build: ./ai-service
    container_name: civicpulse_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MOCK_MODE=true
      - PORT=8000
    networks:
      - civicpulse_net

  backend:
    build: ./backend
    container_name: civicpulse_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:civicpulse123@mongodb:27017/civicpulse?authSource=admin
      - JWT_SECRET=civicpulse_super_secret_jwt_2024_sih
      - JWT_EXPIRES_IN=7d
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - uploads_data:/app/uploads
    networks:
      - civicpulse_net

  frontend:
    build: ./frontend
    container_name: civicpulse_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - civicpulse_net

volumes:
  mongo_data:
  uploads_data:

networks:
  civicpulse_net:
    driver: bridge
